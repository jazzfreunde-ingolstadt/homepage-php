framework:
    messenger:
        failure_transport: failed

        transports:
            sync:
                dsn: 'sync://'
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                    queue_name: failed

        routing:
            'Jazzfreunde\Api\Message\Messages\*': async

when@dev:
    framework:
        messenger:
            routing:
                'Jazzfreunde\Api\Message\Messages\*': sync