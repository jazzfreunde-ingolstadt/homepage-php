framework:
    messenger:
        failure_transport: failed

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: '%env(MESSENGER_TRANSPORT_DSN)%&queue_name=failed'

        routing:
            'Jazzfreunde\App\Message\Messages\*': async

when@test:
   framework:
       messenger:
           transports:
               async: 'in-memory://'
