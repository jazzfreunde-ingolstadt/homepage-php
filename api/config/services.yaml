parameters:
    jazzfreunde.notification.scope_resources: []

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $publicDir: '%kernel.project_dir%/public'

    Jazzfreunde\App\Service\:
        resource: '%kernel.project_dir%/src/Service/'
        exclude: 'Security/**'

    Jazzfreunde\App\Repository\:
        resource: '%kernel.project_dir%/src/Repository/'

    Jazzfreunde\App\Controller\:
        resource: '%kernel.project_dir%/src/Controller/'

    Jazzfreunde\App\Event\:
        resource: '%kernel.project_dir%/src/Event/'
        exclude: '**/*Event'

    Jazzfreunde\App\Message\Handler\:
        resource: '%kernel.project_dir%/src/Message/Handler/'

    # register the service for twig to make createForm available in twig templates
    jazzfreunde.newsletter_subscription:
        class: Jazzfreunde\App\Service\Newsletter\NewsletterFormService

    Symfony\WebpackEncoreBundle\Asset\EntrypointLookupInterface:
        alias: webpack_encore.entrypoint_lookup[mail]
        public: true

    Jazzfreunde\App\Schedule\:
        resource: '%kernel.project_dir%/src/Schedule/'

    Jazzfreunde\App\Service\Notification\Scope\NotificationScopeCollectionProvider:
        arguments:
            $scopeResources: '%jazzfreunde.notification.scope_resources%'

    Jazzfreunde\App\Validation\:
        resource: '%kernel.project_dir%/src/Validation/'
