openapi: 3.1.0
info:
  title: 'Jazzfreunde API'
  description: 'Data access for Jazzfreunde database'
  version: 1.0.0
servers:
  -
    url: /
    description: ''
paths:
  '/api/contracts/cancel/{token}':
    delete:
      operationId: cancel
      tags:
        - Contracts
      responses:
        '202':
          description: 'Cancellation accepted.'
        '410':
          description: 'Confirmation expired'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
          links: {  }
        '404':
          description: 'Confirmation contract not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
          links: {  }
      summary: 'Removes the Contracts resource.'
      description: 'Removes the Contracts resource.'
      parameters:
        -
          name: token
          in: path
          description: 'Contracts identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  '/api/contracts/confirm/{token}':
    post:
      operationId: confirm
      tags:
        - Contracts
      responses:
        '202':
          description: 'Confirmation accepted.'
          links: {  }
        '410':
          description: 'Confirmation expired'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
          links: {  }
        '404':
          description: 'Confirmation contract not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
          links: {  }
      summary: 'Creates a Contracts resource.'
      description: 'Creates a Contracts resource.'
      parameters:
        -
          name: token
          in: path
          description: 'Contracts identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  /api/events:
    get:
      operationId: api_events_get_collection
      tags:
        - Event
      responses:
        '200':
          description: 'Event collection'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event.html'
      summary: 'Retrieves the collection of Event resources.'
      description: 'Retrieves the collection of Event resources.'
      parameters:
        -
          name: page
          in: query
          description: 'The collection page number'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 1
          style: form
          explode: false
        -
          name: itemsPerPage
          in: query
          description: 'The number of items per page'
          required: false
          deprecated: false
          schema:
            type: integer
            default: 30
            minimum: 0
            maximum: 30
          style: form
          explode: false
        -
          name: 'start[before]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'start[strictly_before]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'start[after]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'start[strictly_after]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
          style: form
          explode: false
        -
          name: 'order[start]'
          in: query
          description: ''
          required: false
          deprecated: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
          style: form
          explode: false
  '/api/events/{id}':
    get:
      operationId: api_events_id_get
      tags:
        - Event
      responses:
        '200':
          description: 'Event resource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
            text/html:
              schema:
                $ref: '#/components/schemas/Event.html'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves a Event resource.'
      description: 'Retrieves a Event resource.'
      parameters:
        -
          name: id
          in: path
          description: 'Event identifier'
          required: true
          deprecated: false
          schema:
            type: string
          style: simple
          explode: false
  /api/notifications:
    post:
      operationId: api_notifications_post
      tags:
        - 'Notification Subscriptions'
      responses:
        '200':
          description: 'Restarted unfinalized subscription.'
        '201':
          description: 'Subscription created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification.Subscriptions'
            text/html:
              schema:
                $ref: '#/components/schemas/Notification.Subscriptions.html'
          links: {  }
        '409':
          description: 'Already subscribed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AlreadySubscribedError'
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadySubscribedError'
          links: {  }
      summary: 'Creates a Notification Subscriptions resource.'
      description: 'Creates a Notification Subscriptions resource.'
      parameters: []
      requestBody:
        description: 'The new Notification Subscriptions resource'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification.Subscriptions'
          text/html:
            schema:
              $ref: '#/components/schemas/Notification.Subscriptions.html'
        required: true
  /api/problems/already_subscribed_errors:
    get:
      operationId: api_problemsalready_subscribed_errors_get
      tags:
        - Problems
      responses:
        '409':
          description: 'AlreadySubscribedError resource'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AlreadySubscribedError'
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadySubscribedError'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves a AlreadySubscribedError resource.'
      description: 'Retrieves a AlreadySubscribedError resource.'
      parameters: []
  /api/problems/confirmation_contract_not_found_errors:
    get:
      operationId: api_problemsconfirmation_contract_not_found_errors_get
      tags:
        - Problems
      responses:
        '404':
          description: 'ConfirmationContractNotFoundError resource'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationContractNotFoundError'
          links: {  }
      summary: 'Retrieves a ConfirmationContractNotFoundError resource.'
      description: 'Retrieves a ConfirmationContractNotFoundError resource.'
      parameters: []
  /api/problems/confirmation_period_expired_errors:
    get:
      operationId: api_problemsconfirmation_period_expired_errors_get
      tags:
        - Problems
      responses:
        '410':
          description: 'ConfirmationPeriodExpiredError resource'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationPeriodExpiredError'
        '404':
          description: 'Not found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          links: {  }
      summary: 'Retrieves a ConfirmationPeriodExpiredError resource.'
      description: 'Retrieves a ConfirmationPeriodExpiredError resource.'
      parameters: []
components:
  schemas:
    AlreadySubscribedError:
      type: object
      description: |-
        Error when a subscription already exists for the given email and resource scope.
        This indicates that the user has already subscribed to notifications for this resource.
      properties:
        message:
          default: ''
          type: string
        code:
          default: 0
          type: integer
        file:
          readOnly: true
          default: ''
          type: string
        line:
          readOnly: true
          default: 0
          type: integer
        type:
          readOnly: true
          type: string
        title:
          readOnly: true
          type:
            - string
            - 'null'
        status:
          readOnly: true
          type:
            - integer
            - 'null'
        detail:
          readOnly: true
          type:
            - string
            - 'null'
        instance:
          readOnly: true
          type:
            - string
            - 'null'
        trace:
          readOnly: true
          type: array
          items:
            type:
              - string
              - 'null'
        previous:
          anyOf:
            -
              $ref: '#/components/schemas/Throwable'
            -
              type: 'null'
        traceAsString:
          readOnly: true
          type: string
    ConfirmationContractNotFoundError:
      type: object
      description: 'Error when a confirmation contract cannot be found.'
      properties:
        message:
          default: ''
          type: string
        code:
          default: 0
          type: integer
        file:
          readOnly: true
          default: ''
          type: string
        line:
          readOnly: true
          default: 0
          type: integer
        type:
          readOnly: true
          type: string
        title:
          readOnly: true
          type:
            - string
            - 'null'
        status:
          readOnly: true
          type:
            - integer
            - 'null'
        detail:
          readOnly: true
          type:
            - string
            - 'null'
        instance:
          readOnly: true
          type:
            - string
            - 'null'
        trace:
          readOnly: true
          type: array
          items:
            type:
              - string
              - 'null'
        previous:
          anyOf:
            -
              $ref: '#/components/schemas/Throwable'
            -
              type: 'null'
        traceAsString:
          readOnly: true
          type: string
    ConfirmationPeriodExpiredError:
      type: object
      description: 'Error when the confirmation period for a contract has expired.'
      properties:
        message:
          default: ''
          type: string
        code:
          default: 0
          type: integer
        file:
          readOnly: true
          default: ''
          type: string
        line:
          readOnly: true
          default: 0
          type: integer
        type:
          readOnly: true
          type: string
        title:
          readOnly: true
          type:
            - string
            - 'null'
        status:
          readOnly: true
          type:
            - integer
            - 'null'
        detail:
          readOnly: true
          type:
            - string
            - 'null'
        instance:
          readOnly: true
          type:
            - string
            - 'null'
        trace:
          readOnly: true
          type: array
          items:
            type:
              - string
              - 'null'
        previous:
          anyOf:
            -
              $ref: '#/components/schemas/Throwable'
            -
              type: 'null'
        traceAsString:
          readOnly: true
          type: string
    Error:
      type: object
      description: 'A representation of common errors.'
      properties:
        title:
          readOnly: true
          description: 'A short, human-readable summary of the problem.'
          type:
            - string
            - 'null'
        detail:
          readOnly: true
          description: 'A human-readable explanation specific to this occurrence of the problem.'
          type:
            - string
            - 'null'
        status:
          type:
            - number
            - 'null'
          examples:
            - 404
          default: 400
        instance:
          readOnly: true
          description: 'A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.'
          type:
            - string
            - 'null'
        type:
          readOnly: true
          description: 'A URI reference that identifies the problem type'
          type: string
    Event:
      type: object
      description: 'API resource for planned events (e.g., concerts, meetings, etc.).'
      required:
        - id
        - title
        - start
        - end
        - location
        - category
      properties:
        id:
          type: integer
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/EventLocation'
        subtitle:
          type:
            - string
            - 'null'
        link:
          type:
            - string
            - 'null'
        category:
          type: string
          enum:
            - none
            - session
            - jazztage
            - jazz-and-literature
    Event.html:
      type: object
      description: 'API resource for planned events (e.g., concerts, meetings, etc.).'
      required:
        - id
        - title
        - start
        - end
        - location
        - category
      properties:
        id:
          type: integer
        title:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/EventLocation.html'
        subtitle:
          type:
            - string
            - 'null'
        link:
          type:
            - string
            - 'null'
        category:
          type: string
          enum:
            - none
            - session
            - jazztage
            - jazz-and-literature
    EventLocation:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
        name:
          type: string
      required:
        - name
    EventLocation.html:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
        name:
          type: string
      required:
        - name
    Notification.Subscriptions:
      type: object
      description: 'Subscription for any type of notifications.'
      required:
        - resourceScope
        - email
      properties:
        resourceScope:
          type: string
          example: /events/123
        email:
          format: email
          externalDocs:
            url: 'https://schema.org/email'
          type: string
        expirationTime:
          description: 'Optional expiration time for this notification subscription.'
          type:
            - string
            - 'null'
          format: date-time
    Notification.Subscriptions.html:
      type: object
      description: 'Subscription for any type of notifications.'
      required:
        - resourceScope
        - email
      properties:
        resourceScope:
          type: string
          example: /events/123
        email:
          format: email
          externalDocs:
            url: 'https://schema.org/email'
          type: string
        expirationTime:
          description: 'Optional expiration time for this notification subscription.'
          type:
            - string
            - 'null'
          format: date-time
    Throwable:
      type: object
      properties:
        message:
          readOnly: true
          type: string
        code:
          readOnly: true
        file:
          readOnly: true
          type: string
        line:
          readOnly: true
          type: integer
        trace:
          readOnly: true
          type: array
          items:
            type:
              - string
              - 'null'
        previous:
          anyOf:
            -
              $ref: '#/components/schemas/Throwable'
            -
              type: 'null'
          readOnly: true
        traceAsString:
          readOnly: true
          type: string
  responses: {  }
  parameters: {  }
  examples: {  }
  requestBodies: {  }
  headers: {  }
  securitySchemes: {  }
security: []
tags:
  -
    name: Contracts
    description: 'API resource for confirming and cancelling contracts.'
  -
    name: Problems
    description: |-
      Error when a subscription already exists for the given email and resource scope.
      This indicates that the user has already subscribed to notifications for this resource.
  -
    name: Event
    description: 'API resource for planned events (e.g., concerts, meetings, etc.).'
  -
    name: 'Notification Subscriptions'
    description: 'Subscription for any type of notifications.'
webhooks: {  }
