name: "Install Composer Dependencies"
description: "Action to install Composer dependencies and cache them"

inputs:
  installation-path:
    description: "The path where Composer should be run"
    required: true
  include-dev:
    description: "Whether to include dev dependencies"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Setup PHP"
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4

    - name: "Cache Composer dependencies"
      uses: actions/cache@v6
      with:
        path: ${{ inputs.installation-path }}/vendor
        key: composer${{case(inputs.include-dev == 'true', '-dev', '')}}-${{ hashFiles(format('{0}/composer.lock', inputs.installation-path)) }}

    - name: "Install Composer dependencies (dev)"
      shell: bash
      working-directory: ${{ inputs.installation-path }}
      if: ${{ inputs.include-dev == 'true' }}
      run: composer install --prefer-dist --no-interaction --no-scripts

    - name: "Install Composer dependencies (no-dev)"
      shell: bash
      working-directory: ${{ inputs.installation-path }}
      if: ${{ inputs.include-dev != 'true' }}
      run: composer install --prefer-dist --no-dev --optimize-autoloader --no-scripts