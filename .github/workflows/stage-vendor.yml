name: Stage vendor direcotry
on:
  push:
    branches: [ master ]
    paths:
      - 'src/composer.lock'
  workflow_dispatch:
    
jobs:
  composer:
    uses: jazzfreunde-ingolstadt/homepage-php/.github/workflows/compose-vendor.yml@master
    with:
      artifact-name: stage-vendor-artifact
  
  upload:
    runs-on: ubuntu-latest
    needs: composer
    defaults:
      run:
        shell: bash
        working-directory: ./src
    
    steps:
      # Get repo for sFTP Deploy
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2

      # Get built composer packages
      - uses: actions/download-artifact@main
        with:
          name: stage-vendor-artifact
          path: src/vendor
    
      # Deploy to ftp server
      - name: sFTP Deploy (Staging)
        uses: SamKirkland/FTP-Deploy-Action@3.1.1
        with:
          ftp-server: ${{ secrets.STAGING_FTP_SERVER }}
          ftp-username: ${{ secrets.STAGING_FTP_USER }}
          ftp-password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: src/vendor
          git-ftp-args: --insecure --remote-root vendor/