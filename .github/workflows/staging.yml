name: Staging Deploy
on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - '**.code-workspace'
      - '.devcontainer/**'
      - '.env'
      - '.gitignore'
    
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src
        
    steps:
      # Check out branch
      - uses: actions/checkout@v2
        with:
          fetch-depth: 2
      
      # Install Composer packages
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress
        
      # Store vendor packages
      - uses: actions/upload-artifact@main
        with:
          name: composer artifacts
          path: src/vendor/
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src
    needs: build
    
    steps:
      # Get built composer packages
      - uses: actions/download-artifact@main
        with:
          name: composer artifacts
          path: src/vendor/
    
      # Deploy to ftp server
      - name: sFTP Deploy (Staging)
        uses: SamKirkland/FTP-Deploy-Action@3.1.1
        with:
          ftp-server: ${{ secrets.STAGING_FTP_SERVER }}
          ftp-username: ${{ secrets.STAGING_FTP_USER }}
          ftp-password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: src/
          git-ftp-args: --insecure
