name: Lint source code
on:
  workflow_call:
  pull_request:

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Composer dependencies
        uses: ./.github/actions/install-composer-dependencies
        with:
          installation-path: api
          include-dev: "true"

      - name: "Run PHP Lint"
        run: bin/php-cs-fixer check

      - name: "Run Twig Lint"
        run: bin/console lint:twig

  static-code-analysis:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Composer dependencies
        uses: ./.github/actions/install-composer-dependencies
        with:
          installation-path: api
          include-dev: "true"

      - name: "Run Static Code Analysis"
        run: |
          mkdir var
          chmod +x bin/psalm
          bin/psalm -c=psalm.xml --output-format=github
