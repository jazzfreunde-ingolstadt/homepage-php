name: Run unit tests
on:
  workflow_call:
  pull_request:
    paths:
      - 'src/**'
  push:
    paths:
      - 'src/**'
    branches:
      - 'feature/*'

jobs:
  linting:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: tests-composer-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: Configure matchers
        uses: mheap/phpunit-matcher-action@v1

      - name: Run unit tests
        run: vendor/bin/phpunit --configuration --teamcity phpunit.xml
