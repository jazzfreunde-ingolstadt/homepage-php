name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: ./src

jobs:
  build-vendor-libraries:
    uses: jazzfreunde-ingolstadt/homepage-php/.github/workflows/compose-vendor.yml@master
    with:
      artifact-name: prod-vendor-artifact

  build-app:
    uses: jazzfreunde-ingolstadt/homepage-php/.github/workflows/build-application.yml@master
    with:
      artifact-name: prod-app-artifact
      environment: prod

  build-project:
    name: build homepage-php
    runs-on: ubuntu-latest
    needs: [ build-vendor-libraries, build-app ]
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'

      - name: Download Composer artifact
        uses: actions/download-artifact@v3
        with:
          name: prod-vendor-artifact
          path: src/vendor

      - name: Download Encore artifact
        uses: actions/download-artifact@v3
        with:
          name: prod-app-artifact
          path: src/public

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
  
      - name: Generate deployable .env
        working-directory: ./src
        run: |
          chmod +x bin/console
          echo "APP_ENV=prod" > .env.prod.local
          echo "APP_VERSION=${{ github.event.release.tag_name }}" >> .env.prod.local
          php bin/console secrets:decrypt-to-local --force --env=prod
        env:
          SYMFONY_DECRYPTION_SECRET: ${{ secrets.SYMFONY_PROD_DECRYPT_PRIVATE }}
  
      - name: Prepare environment config
        run: mv .env.prod.local .env.local

      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: 89819d12-f5c7-4de6-bf5c-5bda215d7b2c
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/homepage-php/config.yaml
          action: upload
