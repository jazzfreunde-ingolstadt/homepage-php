name: Build frontend application
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Rerence name of the artifact produced"
        required: true
        type: string
      environment:
        description: "The environment in which to build the app"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v18.x

      - name: Restore cached npm dependencies
        uses: actions/cache/restore@v4
        with:
          path: src/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-scripts

      - name: Install npm dependencies
        run: npm ci

      - name: Cache npm dependencies
        uses: actions/cache/save@v4
        with:
          path: src/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install assets
        run: |
          chmod +x bin/console
          bin/console assets:install --env=build --no-debug

      - name: Build Encore files
        run: |
          npm run ${{ inputs.environment == 'prod' && 'app:build:prod' || 'app:build:dev'}}
          npm run ${{ inputs.environment == 'prod' && 'mail:build:prod' || 'mail:build:dev'}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: src/public/
