name: Compose vendor
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Rerence name of the artifact produced"
        required: true
        type: string

jobs:
  build:
    name: Build vendor libraries
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Composer dependencies
        uses: ./.github/actions/install-composer-dependencies
        with:
          installation-path: ./api

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: api/vendor/
