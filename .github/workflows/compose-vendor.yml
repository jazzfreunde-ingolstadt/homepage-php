name: Compose vendor
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Rerence name of the artifact produced"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./src

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Print current directory
        run: echo $PWD

      - name: Install Composer Dependencies
        uses: php-actions/composer@v6
        with:
          php_version: 8.1
          version: 2
          args: --prefer-dist --no-dev --optimize-autoloader --no-scripts --no-interaction

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ inputs.artifact-name }}
          path: src/vendor/
