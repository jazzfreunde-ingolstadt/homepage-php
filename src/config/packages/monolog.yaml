monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.symfony.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.symfony.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: info
                handler: grouped
                excluded_http_codes: [403, 404, 405]
                buffer_size: 100
            grouped:
                type: group
                members: [streamed, deduplicated]
            streamed:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.symfony.log"
                level: info
            deduplicated:
                type: deduplication
                handler: symfony_mailer
            symfony_mailer:
                type: symfony_mailer
                from_email: "error-log@jazzfreunde-ingolstadt.de"
                to_email: "%env(MAIL_LOG_RECIPIENT)%"
                subject: "Error Report! %%message%%"
                level: error
                formatter:  monolog.formatter.html
                content_type: text/html
