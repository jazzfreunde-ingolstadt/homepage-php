twig:
    default_path: '%kernel.project_dir%/templates'
    paths:
        '%kernel.project_dir%/assets/mail': mail
        '%kernel.project_dir%/public/build/app': app
    globals:
        app_version: '%env(APP_VERSION)%'
        show_sample_data: false
        newsletter_subscription_service: "@jazzfreunde.newsletter_subscription"

when@test:
    twig:
        strict_variables: true

when@dev:
    twig:
        strict_variables: true
        globals:
            show_sample_data: true
