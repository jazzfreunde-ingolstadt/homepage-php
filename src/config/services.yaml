services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    Jazzfreunde\App\Service\:
        resource: '../app/Service/'

    Jazzfreunde\App\Controller\:
        resource: '../app/Controller/'

    Jazzfreunde\App\Service\LegacyStubDeprecated:
        arguments:
            - '%kernel.project_dir%/legacy'

    Jazzfreunde\App\Component\:
        resource: '%kernel.project_dir%/app/Component'

    Jazzfreunde\App\Component\LocalStorage\Share\SharedStorageComponent:
        factory: ['Jazzfreunde\App\Component\LocalStorage\Share\SharedStorageComponent', 'getSharedStorage']

    Jazzfreunde\App\Service\LegacyStub:
        arguments:
        - '%kernel.project_dir%/legacy/pages'