version: 1.0
deploy:
  bootstrap:
    excludes:
      - .gitignore
      - .gitkeep
      - .gitautogenerated
      - src/composer.json
      - src/composer.lock
      - src/var/
      - src/.env.dev
      - src/.env.test
      - .git-ftp-ignore
      - .git-ftp-include
      - src/phpunit.xml
      - src/phpunit.xml.dist
      - src/psalm.xml
      - src/ruleset.xml
      - src/symfony.lock
      - src/package.json
      - src/package-lock.json
      - src/postcss.config.js
      - src/tailwind.config.js
      - src/webpack.config.js
    post-deployment-remote-commands:
      - php8.1-cli bin/console cache:clear
  recurring:
    excludes:
      - .gitignore
      - .gitkeep
      - .gitautogenerated
      - src/composer.json
      - src/composer.lock
      - src/var/
      - src/.env.dev
      - src/.env.test
      - .git-ftp-ignore
      - .git-ftp-include
      - src/phpunit.xml
      - src/phpunit.xml.dist
      - src/psalm.xml
      - src/ruleset.xml
      - src/symfony.lock
      - src/package.json
      - src/package-lock.json
      - src/postcss.config.js
      - src/tailwind.config.js
      - src/webpack.config.js
    pre-deployment-remote-commands:
      - touch ./public/maintenance.htm
      - echo "deploy-now" > ./public/maintenance.htm
    post-deployment-remote-commands:
      - php8.1-cli bin/console cache:clear
      - rm -f ./public/maintenance.htm
