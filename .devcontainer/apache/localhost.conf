<VirtualHost *:80>
	DocumentRoot ${APACHE_DOCUMENT_ROOT}
	ServerAdmin webmaster@localhost
	ServerName localhost

	<Directory ${APACHE_DOCUMENT_ROOT}>
		Options +MultiViews
		AllowOverride FileInfo Indexes
		Require all granted
		Order allow,deny
		allow from all
		# For Root outside var/www/
	</Directory>

	<Files .htaccess>
    	Require all denied
	</Files>
</VirtualHost>

<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerAdmin webmaster@localhost
		DocumentRoot ${APACHE_DOCUMENT_ROOT}

		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined
		
	    ServerName localhost
	    SSLEngine on
	    SSLCertificateFile "/etc/apache2/conf-enabled/localhost.crt"
	    SSLCertificateKeyFile "/etc/apache2/conf-enabled/localhost.key"
	
		SSLOptions +StdEnvVars

		<Directory ${APACHE_DOCUMENT_ROOT}>
			Options +MultiViews
			AllowOverride FileInfo Indexes
			Require all granted
			Order allow,deny
			allow from all
			# For Root outside var/www/
		</Directory>
	
		<Files .htaccess>
	    	Require all denied
		</Files>
	</VirtualHost>
</IfModule>