<VirtualHost *:80>
	DocumentRoot ${APACHE_DOCUMENT_ROOT}
	ServerName localhost

	<Directory ${APACHE_DOCUMENT_ROOT}>
		Options +MultiViews
		AllowOverride FileInfo Indexes
		Require all granted
		Order allow,deny
		allow from all
		# For Root outside var/www/
	</Directory>

	<Files .htaccess>
    	Require all denied
	</Files>
</VirtualHost>