version: '3.9'

services:
    php-dev-cli:
        container_name: jazzfreunde-vscode-dev
        build:
            context: .
            dockerfile: php-cli.dockerfile
        volumes:
            - type: bind
              source: ..
              target: /usr/project
        secrets:
            - user_ssh_key
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: /bin/sh -c "while sleep 1000; do :; done"

    apache-server:
        container_name: jazzfreunde-php-apache

        build:
            context: .
            dockerfile: apache.dockerfile
        depends_on:
            - database-server
        environment:
            - APACHE_DOCUMENT_ROOT=/usr/project/src/public
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - type: bind
              source: ..
              target: /usr/project

    database-server:
        container_name: jazzfreunde-mysql-database
        image: mysql:latest

        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: jazzfreunde-api
            MYSQL_USER: dbu_localdev
            MYSQL_PASSWORD: 6hdth6e#
        ports:
            - 3306:3306
        volumes:
            - type: volume
              source: mysql-data-jazzfreunde
              target: /var/lib/mysql

    database-admin:
        container_name: jazzfreunde-mysql-admin
        image: phpmyadmin/phpmyadmin:latest
        depends_on:
            - database-server

        environment:
            PMA_HOST: jazzfreunde-mysql-database
            PMA_USER: dbu_localdev
            PMA_PASSWORD: 6hdth6e#
        ports:
          - "81:80"
volumes:
    mysql-data-jazzfreunde:

secrets:
    user_ssh_key:
        file: ~/.ssh/id_ed25519